services:

  db:
    image: mysql:8.0
    container_name: globalpop-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: world

    ports:
      - "33061:3306"

    volumes:
      - ./database/world.sql:/docker-entrypoint-initdb.d/world.sql:ro
      - globalpop-mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 5s
      retries: 20
      interval: 5s

volumes:
  globalpop-mysql-data: