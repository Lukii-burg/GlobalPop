name: GlobalPop CI

on: push

jobs:
  build:
    name: Build GlobalPop
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn package

      - name: Build Docker Image
        run: docker build -t globalpop .

      - name: Run Docker Image
        run: docker run --name globalpop-container globalpop

      - name: View Logs
        run: docker logs globalpop-container
