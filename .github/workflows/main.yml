
name: GlobalPop CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and Test GlobalPop
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 33061
      DB_NAME: world
      DB_USER: root
      DB_PASSWORD: root

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Set up Java 25
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 3. Validate Docker Compose
      - name: Validate Docker Compose
        run: docker compose config -q

      # 4. Start MySQL database
      - name: Start MySQL Database
        run: docker compose up -d --wait db

      # 5. Run ALL unit and integration tests
      - name: Run All Unit and Integration Tests
        run: mvn clean verify

      # 6. Build and run application using Docker
      - name: Build and Run Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from app

      # 7. Display Docker Compose logs
      - name: Display Docker Compose Logs
        if: always()
        run: docker compose logs

      # 8. Clean up containers and volumes
      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v
