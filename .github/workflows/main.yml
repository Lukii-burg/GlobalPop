
name: GlobalPop CI

on:
  push:
    branches:
      - master
      - develop
      - 'Testing/**'

  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. UNIT TESTS
  # ==========================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn -B -ntp clean test

  # ==========================================
  # 2. INTEGRATION TESTS
  # ==========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 33061
      DB_NAME: world
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Start MySQL Database
        run: docker compose up -d --wait db

      - name: Run Integration Tests
        run: >
          mvn -B -ntp clean test-compile
          failsafe:integration-test
          failsafe:verify

      - name: Display Database Logs
        if: failure()
        run: docker compose logs db

      - name: Stop MySQL Database
        if: always()
        run: docker compose down -v

  # ==========================================
  # 3. BUILD AND RUN APPLICATION
  # ==========================================
  build:
    name: Build and Package GlobalPop
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - integration-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and Package JAR
        run: mvn -B -ntp clean package -DskipTests

      - name: Build and Run Docker Compose
        run: >
          docker compose up
          --build
          --abort-on-container-exit
          --exit-code-from app

      - name: Display Docker Compose Logs
        if: always()
        run: docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v
